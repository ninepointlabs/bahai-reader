name: bahai_reader
description: "Flutter port of Bahá’í Reader. Offline; the network is used only to download a language when asked."
publish_to: 'none'
version: 1.1.2+112

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.6
  dbus: ^0.8.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  pdfrx: 2.12.0
  sqlite3: 3.8.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/library/
    - assets/calendar/
    - assets/licenses/pdfium/
    - DATA-NOTICE.md
    - LICENSE

# Microsoft Store package (MSIX), built in CI with `dart run msix:create`. The Store signs a Store package itself, so
# no certificate is used here (`store: true` skips signing). The three identity values below are placeholders: copy
# the real ones from Partner Center > the app > Product identity once the name "Bahá’í Reader" is reserved. Until then
# the package builds, but the Store would reject it. msix_version is the app version with a .0 revision (the Store
# requires revision 0); CI checks that it matches `version` above.
msix_config:
  display_name: Bahá’í Reader
  # TODO(Partner Center): Package/Identity/Name
  identity_name: TODO-PartnerCenter-IdentityName
  # TODO(Partner Center): Package/Identity/Publisher (the CN=... value)
  publisher: CN=TODO-PartnerCenter-Publisher
  # TODO(Partner Center): Package/Properties/PublisherDisplayName
  publisher_display_name: TODO-PartnerCenter-PublisherDisplayName
  msix_version: 1.1.2.0
  store: true
  logo_path: packaging/icons/hicolor/512x512/apps/org.bahai.Reader.png
  languages: en-us
  # The Windows build downloads a language from bahaiprayers.net when asked (lib/core/library/downloads.dart).
  # runFullTrust is added by the msix package. No location, microphone or other capability.
  capabilities: internetClient
  build_windows: false
