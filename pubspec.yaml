name: bahai_reader
description: "Flutter port of Bahá’í Reader. Offline; the network is used only to download a language when asked."
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: ^3.13.7

dependencies:
  dbus: ^0.8.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/library/
    - assets/calendar/
    - DATA-NOTICE.md
    - LICENSE
