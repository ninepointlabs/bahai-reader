name: bahai_reader
description: "Experimental Flutter port of Bahá’í Reader. Offline; no network calls at runtime."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/library/
    - DATA-NOTICE.md
    - LICENSE
