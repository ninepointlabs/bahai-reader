name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the AppImage and Flatpak to, e.g. v0.1.3 (VERSION must match). Leave empty to only build.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb dbus-x11 desktop-file-utils appstream x11-utils file zsync
      - run: /usr/bin/python3 -m unittest discover -s tests
      - run: xvfb-run -a /usr/bin/python3 tests/navigation_ui.py
      - run: xvfb-run -a /usr/bin/python3 tests/smoke_ui.py
      - run: xvfb-run -a /usr/bin/python3 tests/robustness_ui.py
      - run: desktop-file-validate packaging/org.bahai.Reader.desktop
      - run: appstreamcli validate --no-net packaging/org.bahai.Reader.metainfo.xml
      - run: scripts/get-nfpm.sh "$RUNNER_TEMP/nfpm"
      - run: NFPM="$RUNNER_TEMP/nfpm/nfpm" scripts/build-packages.sh
      - run: scripts/build-appimage.sh "dist/bahai-reader-$(cat VERSION)-x86_64.AppImage"
      - run: xvfb-run -a tests/appimage_check.sh "dist/bahai-reader-$(cat VERSION)-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-flatpak.sh "dist/bahai-reader-$(cat VERSION)-x86_64.flatpak"
      - name: Install the bundle and launch the UI inside the sandbox
        run: |
          flatpak install --user -y --noninteractive dist/*.flatpak
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; sleep 2
          timeout 300 dbus-run-session -- flatpak run --filesystem="$PWD:ro" --command=python3 org.bahai.Reader "$PWD/tests/smoke_ui.py" flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*
  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      # Debian runs Xvfb directly too: as the container's PID 1, xvfb-run never
      # sees Xvfb's SIGUSR1 readiness signal and waits forever.
      - name: Install package and launch native UI
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          case "$DISTRO" in
            debian)
              docker run --rm -v "$PWD:/work:ro" debian:12 bash -ec 'apt-get update; apt-get install -y /work/dist/*.deb xvfb dbus-x11; Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; sleep 2; timeout 300 /usr/bin/python3 /work/tests/smoke_ui.py installed'
              ;;
            fedora)
              docker run --rm -v "$PWD:/work:ro" fedora:43 bash -ec 'dnf install -y /work/dist/*.rpm xorg-x11-server-Xvfb mesa-libGL mesa-libEGL mesa-libGLES dbus-daemon; Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; sleep 2; timeout 300 /usr/bin/python3 /work/tests/smoke_ui.py installed'
              ;;
            arch)
              docker run --rm -v "$PWD:/work:ro" archlinux:base bash -ec 'pacman -Syu --noconfirm; pacman -U --noconfirm /work/dist/*.pkg.tar.zst; pacman -S --noconfirm xorg-server-xvfb xorg-xauth dbus; Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; sleep 2; timeout 300 /usr/bin/python3 /work/tests/smoke_ui.py installed'
              ;;
          esac
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
          (cd dist && sha256sum ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.AppImage ./*.flatpak > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Bahá’í Reader $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md --verify-tag
  # Manual backfill, built from the branch the workflow is run on: uploads only the AppImage
  # (+ .zsync, .sha256) and Flatpak (+ .sha256) to an existing release, replacing older copies of
  # those files, and rewrites SHA256SUMS keeping every other line. Other assets are not touched.
  attach:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach AppImage and Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "${TAG#v}" = "$(cat VERSION)"
          echo "Assets before:"; gh release view "$TAG" --json assets --jq '.assets[].name'
          cd dist
          gh release download "$TAG" --pattern SHA256SUMS --dir old
          { grep -v -e '\.AppImage$' -e '\.flatpak$' old/SHA256SUMS || true; sha256sum ./*.AppImage ./*.flatpak; } > SHA256SUMS
          gh release upload "$TAG" ./*.AppImage ./*.AppImage.zsync ./*.AppImage.sha256 ./*.flatpak ./*.flatpak.sha256 SHA256SUMS --clobber
          echo "Assets after:"; gh release view "$TAG" --json assets --jq '.assets[].name'
